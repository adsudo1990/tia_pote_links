<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tía Pote | Pastelería moderna</title>
<meta name="description" content="Tía Pote — Pastelería moderna. Escribinos por WhatsApp o seguinos en Instagram y TikTok.">

<!-- FAVICON -->
<link rel="icon" type="image/png" href="images/favicon.png">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FontAwesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>

:root{
    --violeta:#7b549e;
    --violeta-osc:#5c3d78;
    --mostaza:#dbd488;
    --menta:#8dc5b6;
    --texto:#2e2338;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;

    background-color:#ffffff;
    position:relative;
}

/* TRAMA REPOSTERIA (imagen) AL 50% DE OPACIDAD */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;

    opacity:.5;

    background-image:url('images/tiapote-patron.jpg');
    background-repeat:repeat;
}

/* CONTENEDOR */
.contenedor-um{
    position:relative;
    width:100%;
    max-width:470px;

    background:#ffffff;

    border-radius:34px;

    padding:
    40px
    30px
    36px;

    border:1.5px solid rgba(123,84,158,.25);

    box-shadow:
    0 0 0 1px rgba(255,255,255,.4),
    0 30px 70px rgba(92,61,120,.35),
    inset 0 0 60px rgba(219,212,136,.06);

    overflow:hidden;
}

/* BORDE INTERNO */
.contenedor-um::before{
    content:"";
    position:absolute;
    inset:13px;
    border-radius:24px;
    border:1.5px dashed rgba(141,197,182,.45);
    pointer-events:none;
}

/* LOGO */
.logo-wrapper{
    text-align:center;
}

.logo{
    width:88%;
    max-width:340px;
    margin:auto;
    display:block;
}

/* SUBTITULO */
.subtitulo{
    color:var(--texto);
    text-align:center;
    margin-top:18px;
    margin-bottom:26px;
    opacity:.75;

    font-family:'Quicksand', sans-serif;
    font-size:1rem;
    font-weight:600;
    letter-spacing:.2px;
    line-height:1.5;
}

/* BOTONES */
.link-card{
    position:relative;

    display:flex;
    align-items:center;

    gap:16px;

    width:100%;

    text-decoration:none;

    background:#ffffff;

    border:1.5px solid rgba(123,84,158,.22);

    padding:2px;

    border-radius:16px;

    overflow:hidden;

    transition:.28s ease;

    box-shadow:
    0 8px 18px rgba(92,61,120,.10);
}

/* LIGHT SWEEP */
.link-card::before{
    content:"";

    position:absolute;
    top:0;
    left:-120%;

    width:60%;
    height:100%;

    background:
    linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,.15) 30%,
    rgba(255,255,255,.85) 50%,
    rgba(255,255,255,.15) 70%,
    transparent 100%
    );

    transform:skewX(-20deg);

    animation:lightSweep 4.5s ease-in-out infinite;
}

@keyframes lightSweep{
    0%{
        left:-120%;
    }
    35%{
        left:140%;
    }
    100%{
        left:140%;
    }
}

.link-card:hover{
    transform:translateY(-3px) scale(1.01);
    border-color:rgba(123,84,158,.5);

    box-shadow:
    0 16px 32px rgba(92,61,120,.20),
    0 0 20px rgba(141,197,182,.35);
}

.link-card:hover .icon-box{
    background:#dbd488);
}

.link-card:hover .icon-box i{
    color:var(--violeta-osc);
}

/* ICONO IZQUIERDO */
.icon-box{
    width:52px;
    height:52px;

    min-width:52px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:var(--violeta);

    transition:.28s ease;
}

.icon-box i{
    color:#fff;
    font-size:1.4rem;
    transition:.28s ease;
}

/* TEXTO BOTON */
.link-card span{
    font-family:'Baloo 2', sans-serif;
    color:var(--texto);
    font-weight:700;
    font-size:1.08rem;
    letter-spacing:.2px;
}

.link-card small{
    display:block;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:.78rem;
    color:var(--violeta);
    opacity:.8;
    margin-top:1px;
}

/* ORNAMENTO */
.ornament{
    margin:26px auto 20px;
    width:90px;
    height:2px;
    background:linear-gradient(
    90deg,
    transparent,
    var(--mostaza),
    transparent
    );
    position:relative;
}

.ornament::before{
    content:"✧";
    position:absolute;
    top:-11px;
    left:50%;
    transform:translateX(-50%);
    color:#dbd488;
    font-size:18px;
}

/* FOOTER */
.footer-note{
    text-align:center;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:.85rem;
    color:var(--violeta);
    opacity:.65;
}

/* RESPONSIVE */
@media(max-width:576px){

    body{
        padding:22px 14px;
    }

    .contenedor-um{
        padding:32px 20px 28px;
        border-radius:28px;
    }

    .logo{
        width:100%;
    }

    .subtitulo{
        font-size:.92rem;
    }

    .link-card span{
        font-size:1rem;
    }
}

</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-12 col-md-7 col-lg-5">

<div class="contenedor-um">

    <!-- LOGO -->
    <div class="logo-wrapper">
        <img src="images/tia-pote-logo.png"
             class="logo"
             alt="Tía Pote - Pastelería Moderna">
    </div>

    <!-- SUBTITULO -->
    <div class="subtitulo">
        Elegí por dónde querés escribirme
    </div>

    <!-- BOTONES -->
    <div class="d-grid gap-3">

        <a href="https://api.whatsapp.com/send?phone=5491157447321&text=Hola,%20me%20comunico%20de%20la%20web%20quiero%20m%C3%A1s%20info%20sobre%20los%20productos.%20Gracias"
           target="_blank"
           rel="noopener"
           class="link-card">

            <div class="icon-box">
                <i class="fab fa-whatsapp"></i>
            </div>

            <span>Hacer un pedido
            <small>WhatsApp</small></span>
        </a>

        <a href="https://api.whatsapp.com/send?phone=5491157447321&text=Hola,%20me%20comunico%20de%20la%20web%20quiero%20m%C3%A1s%20info%20sobre%20los%20productos.%20Gracias"
           target="_blank"
           rel="noopener"
           class="link-card">

            <div class="icon-box">
                <i class="fab fa-whatsapp"></i>
            </div>

            <span>Consultas
            <small>WhatsApp</small></span>
        </a>

        <a href="https://www.instagram.com/tiapotepasteleria"
           target="_blank"
           rel="noopener"
           class="link-card">

            <div class="icon-box">
                <i class="fab fa-instagram"></i>
            </div>

            <span>@tiapotepasteleria
            <small>Instagram</small></span>
        </a>

        <a href="https://www.tiktok.com/@tia.pote"
           target="_blank"
           rel="noopener"
           class="link-card">

            <div class="icon-box">
                <i class="fab fa-tiktok"></i>
            </div>

            <span>@tia.pote
            <small>TikTok</small></span>
        </a>



    </div>

    <div class="ornament"></div>

    <div class="footer-note">
        Espero tu consulta, disfruta de una experencia diferente.
    </div>

</div>
</div>
</div>
</div>

</body>
</html>
